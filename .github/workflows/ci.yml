name: FaultTrace CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FAULTTRACE_ALLOW_INFERENCE: '0'
  NEBIUS_API_KEY: ''

jobs:
  backend:
    name: Backend / Python 3.12
    # Committed PNG regeneration is byte-for-byte verified on Windows; Linux
    # produced different bytes. Keep the assertion/fixtures intact.
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-backend.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-backend.txt
      - name: Check backend dependencies
        run: python -m pip check
      - name: Full backend tests / external network forbidden
        run: python tools/run_offline_tests.py

  frontend:
    name: Frontend / Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies from lockfile
        run: npm ci
      - name: Frontend tests / static checks, not browser verification
        run: npm test
      - name: TypeScript checks
        run: npm run typecheck
      - name: Production build
        run: npm run build

  combined:
    name: Combined authenticated ASGI contract / no provider
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Install existing backend specification
        run: python -m pip install -r requirements-backend.txt
      - name: Install existing frontend lockfile
        working-directory: frontend
        run: npm ci
      - name: Real frontend classes against release API / not a browser test
        working-directory: frontend
        run: node tests/combined-contract.mjs
