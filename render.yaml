# User-approved: one NEW Starter service + 1 GiB disk, $7.25/month baseline.
# Verify current account quote and unused service name before provisioning.
services:
  - type: web
    name: faulttrace-judge-demo
    runtime: docker
    branch: feat/finish-integrated
    plan: 0.5c-512mb # Current name for the approved $7/month 512 MB tier.
    region: oregon
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /healthz
    disk:
      name: faulttrace-private-data
      mountPath: /var/lib/faulttrace
      sizeGB: 1
    envVars:
      - key: FAULTTRACE_BUILD_REVISION
        sync: false
      - key: FAULTTRACE_DEMO_ROOT
        value: /var/lib/faulttrace/judge
      - key: FAULTTRACE_DEMO_ORIGIN
        sync: false
      - key: FAULTTRACE_PERSISTENT_STORAGE_CONFIRMED
        value: '1'
      - key: FAULTTRACE_DEMO_LIVE
        value: '0'
      - key: FAULTTRACE_ALLOW_INFERENCE
        value: '0'
      - key: FAULTTRACE_TAVILY_ENABLED
        value: '0'
      - key: FAULTTRACE_LANGSMITH_TRACING
        value: '0'
      - key: WEB_CONCURRENCY
        value: '1'
